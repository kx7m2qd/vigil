rules:
  - id: py-sql-formatted-query
    languages: [python]
    severity: WARNING
    message: >-
      A SQL statement is built with string formatting (f-string, `%`, `.format` or `+`) and then
      executed. If any interpolated value can come from a caller, a request, a file or another
      service, it can rewrite the query. Pass values as parameters instead:
      `cur.execute("... WHERE id = %s", (user_id,))`, `text("... :id").bindparams(id=user_id)`, or
      `pd.read_sql_query(sql, con, params=[...])`. Identifiers (table/column names) must come from
      an allowlist.
    metadata:
      title: SQL built with string formatting
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      owasp: ["A03:2021 - Injection"]
      confidence: medium
    mode: taint
    options:
      symbolic_propagation: true
    pattern-sources:
      # f-strings, except one whose only interpolation is a run of bind placeholders
      # (`placeholders = ",".join("?" * len(ids))`). `...` in an f-string pattern does not span
      # other interpolations, so `f"... FROM {table} WHERE id IN ({placeholders})"` stays a source.
      - patterns:
          # Inside its own block: next to `pattern: $SRC` these pattern-nots stop excluding.
          - patterns:
              # At least one interpolation: `f"... WHERE x = ?"` is a plain string.
              - pattern: f"...{$X}..."
              - pattern-not: 'f"...{$S.join(''?'' * $N)}..."'
              - pattern-not: 'f"...{$S.join([''?''] * $N)}..."'
              - pattern-not: 'f"...{$S.join(''?'' for $I in $L)}..."'
              - pattern-not: 'f"...{$S.join([''?'' for $I in $L])}..."'
              - pattern-not: 'f"...{$S.join(''%s'' * $N)}..."'
              - pattern-not: 'f"...{$S.join([''%s''] * $N)}..."'
              - pattern-not: 'f"...{$S.join(''%s'' for $I in $L)}..."'
              - pattern-not: 'f"...{$S.join([''%s'' for $I in $L])}..."'
          - pattern: $SRC
          - metavariable-regex:
              metavariable: $SRC
              regex: (?is).*\b(select\s|insert\s+into|update\s.+\sset\s|delete\s+from|where\s|order\s+by|(create|alter|drop)\s+table)
      - patterns:
          - pattern-either:
              - pattern: '"..." % $ARGS'
              - pattern: '"...".format(...)'
              - pattern: '"..." + $X'
              - pattern: '$X + "..."'
          - pattern: $SRC
          - metavariable-regex:
              metavariable: $SRC
              regex: (?is).*\b(select\s|insert\s+into|update\s.+\sset\s|delete\s+from|where\s|order\s+by|(create|alter|drop)\s+table)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($SQL, ...)
              - pattern: $CUR.executemany($SQL, ...)
              - pattern: $CUR.executescript($SQL, ...)
              - pattern: $MODEL.objects.raw($SQL, ...)
              - pattern: $X.query_raw($SQL, ...)
              - pattern: $X.query_raw(..., query=$SQL, ...)
              - pattern: $X.execute_raw($SQL, ...)
              - pattern: sqlalchemy.text($SQL, ...)
              - pattern: pandas.read_sql($SQL, ...)
              - pattern: pandas.read_sql_query($SQL, ...)
          - focus-metavariable: $SQL
