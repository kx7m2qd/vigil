rules:
  - id: py-sql-injection
    languages: [python]
    severity: ERROR
    message: >-
      Request data is formatted into a SQL string (f-string, `%`, `+` or `.format`). An attacker can
      rewrite the query to read or modify any data. Pass values as parameters:
      `cursor.execute("... WHERE id = %s", (user_id,))`, or use the ORM's query API.
    metadata:
      title: SQL injection
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      owasp: ["A03:2021 - Injection"]
      confidence: high
      severity: critical
    mode: taint
    pattern-sources:
      - pattern: flask.request.$ATTR
      - pattern: flask.request.$METHOD(...)
      - patterns:
          - pattern-inside: |
              def $VIEW($REQ, ...):
                ...
          - pattern-either:
              - pattern: $REQ.GET
              - pattern: $REQ.POST
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($SQL, ...)
              - pattern: $CUR.executemany($SQL, ...)
              - pattern: $CUR.executescript($SQL, ...)
              - pattern: $MODEL.objects.raw($SQL, ...)
              - pattern: sqlalchemy.text($SQL, ...)
          - focus-metavariable: $SQL
