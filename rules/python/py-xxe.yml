rules:
  - id: py-xxe
    languages: [python]
    severity: ERROR
    message: >-
      Request data is parsed as XML by a parser that has external entities turned on. An attacker can
      send `<!DOCTYPE x [<!ENTITY e SYSTEM "file:///etc/passwd">]>` and the parser will read local
      files or fetch internal URLs (SSRF) and put the result into the document. Leave external
      entities off: drop the `setFeature(feature_external_ges/feature_external_pes, True)` call, or
      build lxml parsers with `resolve_entities=False, no_network=True`. For untrusted XML, prefer
      `defusedxml` (`defusedxml.ElementTree.fromstring`, `defusedxml.minidom.parseString`).
    metadata:
      title: XML external entity (XXE) injection
      cwe: ["CWE-611: Improper Restriction of XML External Entity Reference"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      confidence: high
    mode: taint
    pattern-sources:
      # Routing-only attributes are decided by the URL map, not free attacker text.
      - patterns:
          - pattern: flask.request.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(?!(path|full_path|script_root|url_rule|endpoint|method|blueprint|blueprints)$)
      - pattern: $WRAP(flask.request)
      - patterns:
          - pattern-inside: |
              def $VIEW($REQ, ...):
                ...
          - pattern-either:
              - pattern: $REQ.GET
              - pattern: $REQ.POST
              - pattern: $REQ.COOKIES
              - pattern: $REQ.headers
              - pattern: $REQ.body
    pattern-sinks:
      # A SAX parser with external general/parameter entities switched on, then used to parse.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $P.setFeature(xml.sax.handler.$FEAT, True)
                  ...
              - pattern-inside: |
                  $P.setFeature(xml.sax.handler.$FEAT, 1)
                  ...
          - metavariable-regex:
              metavariable: $FEAT
              regex: ^feature_external_(ges|pes)$
          - pattern-either:
              - pattern: xml.dom.minidom.parseString($X, $P, ...)
              - pattern: xml.dom.minidom.parse($X, $P, ...)
              - pattern: xml.dom.pulldom.parseString($X, $P, ...)
              - pattern: xml.dom.pulldom.parse($X, $P, ...)
              - pattern: $P.parse($X, ...)
              - pattern: $P.feed($X, ...)
          - focus-metavariable: $X
      # lxml parser that resolves external entities or may fetch over the network.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $P = lxml.etree.XMLParser(..., resolve_entities=True, ...)
                  ...
              - pattern-inside: |
                  $P = lxml.etree.XMLParser(..., no_network=False, ...)
                  ...
          - pattern-either:
              - pattern: lxml.etree.fromstring($X, $P, ...)
              - pattern: lxml.etree.fromstring($X, parser=$P, ...)
              - pattern: lxml.etree.XML($X, $P, ...)
              - pattern: lxml.etree.XML($X, parser=$P, ...)
              - pattern: lxml.etree.parse($X, $P, ...)
              - pattern: lxml.etree.parse($X, parser=$P, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: lxml.etree.fromstring($X, parser=lxml.etree.XMLParser(..., resolve_entities=True, ...), ...)
              - pattern: lxml.etree.fromstring($X, lxml.etree.XMLParser(..., resolve_entities=True, ...), ...)
              - pattern: lxml.etree.parse($X, parser=lxml.etree.XMLParser(..., resolve_entities=True, ...), ...)
          - focus-metavariable: $X
