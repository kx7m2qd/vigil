rules:
  - id: py-weak-random
    languages: [python]
    severity: WARNING
    message: >-
      A session ID, token, OTP, nonce or other secret is generated with the `random` module. Its
      Mersenne Twister output is predictable: after seeing ~624 values an attacker can compute every
      future one and forge sessions or reset links. Use the `secrets` module instead
      (`secrets.token_urlsafe()`, `secrets.token_hex()`, `secrets.randbelow()`) or `random.SystemRandom()`.
    metadata:
      title: Insecure randomness for a security value
      cwe: ["CWE-330: Use of Insufficiently Random Values"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: medium
      severity: medium
    # Search mode, not taint: taint drops through slices like `str(random.random())[2:]`.
    # Scoped to values stored as secrets; `random` for jitter, sampling or shuffling is fine.
    patterns:
      - pattern-either:
          # The weak value is written straight into the sink...
          - pattern: $SINK = <... random.$F(...) ...>
          - pattern: $R.set_cookie($K, <... random.$F(...) ...>, ...)
          - pattern: $C(..., $SINK=<... random.$F(...) ...>, ...)
          # ...or via a local first.
          - patterns:
              - pattern-inside: |
                  $V = <... random.$F(...) ...>
                  ...
              - pattern-either:
                  - pattern: $SINK = <... $V ...>
                  - pattern: $R.set_cookie($K, <... $V ...>, ...)
                  - pattern: $C(..., $SINK=<... $V ...>, ...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(random|randint|randrange|randbytes|getrandbits|choice|choices|sample|shuffle|uniform|triangular|gauss|normalvariate|lognormvariate|betavariate|expovariate|gammavariate|paretovariate|weibullvariate|vonmisesvariate)$
      - pattern-either:
          - pattern: $R.set_cookie(...)
          - patterns:
              - pattern-either:
                  - pattern: $D[$K] = $X
              - metavariable-regex:
                  metavariable: $D
                  regex: (?i).*session
          - pattern: $D["=~/(?i)(token|nonce|otp|secret|passw|session|salt|csrf|api_?key)/"] = $X
          - patterns:
              - pattern-either:
                  - pattern: $O.$W = $X
                  - pattern: $C(..., $W=$X, ...)
              - metavariable-regex:
                  metavariable: $W
                  regex: (?i).*(token|nonce|otp|secret|passw|session|salt|csrf|api_?key)
          # A bare local called `token` is too vague (MIME boundaries, parser tokens).
          - patterns:
              - pattern: $W = $X
              - metavariable-regex:
                  metavariable: $W
                  regex: (?i).*(nonce|otp|secret|passw|session|salt|csrf|api_?key|.token|token.)
