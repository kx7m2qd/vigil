rules:
  - id: py-ldap-injection
    languages: [python]
    severity: ERROR
    message: >-
      Request data is pasted into an LDAP search filter. An attacker can send `*` or close the
      parenthesis and add their own clause (`*)(uid=*))(|(uid=*`) to list every account, skip a
      password check, or read attributes the search was meant to hide. Escape the value before
      putting it in the filter: `ldap3.utils.conv.escape_filter_chars(value)` (ldap3) or
      `ldap.filter.filter_format("(uid=%s)", [value])` / `ldap.filter.escape_filter_chars(value)`
      (python-ldap).
    metadata:
      title: LDAP injection
      cwe: ["CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: high
    mode: taint
    pattern-sources:
      # Routing-only attributes are decided by the URL map, not free attacker text.
      - patterns:
          - pattern: flask.request.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(?!(path|full_path|script_root|url_rule|endpoint|method|blueprint|blueprints)$)
      - pattern: $WRAP(flask.request)
      - patterns:
          - pattern-inside: |
              def $VIEW($REQ, ...):
                ...
          - pattern-either:
              - pattern: $REQ.GET
              - pattern: $REQ.POST
              - pattern: $REQ.COOKIES
              - pattern: $REQ.headers
              - pattern: $REQ.body
    pattern-sanitizers:
      - pattern: ldap3.utils.conv.escape_filter_chars(...)
      - pattern: ldap.filter.escape_filter_chars(...)
      - pattern: ldap.filter.filter_format(...)
      - pattern: int(...)
      - patterns:
          - pattern: $FN(...)
          - metavariable-regex:
              metavariable: $FN
              regex: (?i).*(escape_?filter|ldap_?escape|escape_?ldap|clean_?ldap)
    pattern-sinks:
      # python-ldap: the filter is the third argument and the method names are LDAP-only.
      - patterns:
          - pattern-either:
              - pattern: $L.search($B, $SCOPE, $F, ...)
              - pattern: $L.search_s($B, $SCOPE, $F, ...)
              - pattern: $L.search_st($B, $SCOPE, $F, ...)
              - pattern: $L.search_ext($B, $SCOPE, $F, ...)
              - pattern: $L.search_ext_s($B, $SCOPE, $F, ...)
              - pattern: $L.search_s($B, $SCOPE, filterstr=$F, ...)
              - pattern: $L.search_ext_s($B, $SCOPE, filterstr=$F, ...)
          - pattern-either:
              - pattern-inside: |
                  $L = ldap.initialize(...)
                  ...
              - patterns:
                  - pattern: $L.$SEARCH(...)
                  - metavariable-regex:
                      metavariable: $SEARCH
                      regex: ^search_(s|st|ext|ext_s)$
          - focus-metavariable: $F
      # ldap3: Connection.search(search_base, search_filter, ...). `.search` is a common name
      # (re.search, list search helpers), so the receiver must be a known or LDAP-named connection.
      - patterns:
          - pattern-either:
              - pattern: $C.search($B, $F, ...)
              - pattern: $C.search($B, search_filter=$F, ...)
              - pattern: $C.search(search_base=$B, search_filter=$F, ...)
              - pattern: $C.extend.standard.paged_search($B, $F, ...)
          - pattern-not: re.search(...)
          - pattern-not: regex.search(...)
          - pattern-either:
              - pattern-inside: |
                  $C = ldap3.Connection(...)
                  ...
              - pattern-inside: |
                  with ldap3.Connection(...) as $C:
                    ...
              - patterns:
                  - pattern: $C.$M(...)
                  - metavariable-regex:
                      metavariable: $C
                      regex: (?i)^(self\.)?(_?\w*conn(ection)?|_?\w*ldap\w*|ld|_?directory)$
          - focus-metavariable: $F
