rules:
  - id: py-xpath-injection
    languages: [python]
    severity: ERROR
    message: >-
      Request data is pasted into an XPath query. An attacker can close the quote and add their own
      predicate (`' or '1'='1`) to read every node in the document, bypass a lookup used for login,
      or pull out data the query was meant to hide. Pass the value as an XPath variable instead of
      formatting it into the string: lxml `root.xpath("//user[@id=$uid]", uid=value)` or
      `lxml.etree.XPath("//user[@id=$uid]")(root, uid=value)`; elementpath
      `elementpath.select(root, "//user[@id=$uid]", variables={"uid": value})`.
    metadata:
      title: XPath injection
      cwe: ["CWE-643: Improper Neutralization of Data within XPath Expressions ('XPath Injection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: high
    mode: taint
    pattern-sources:
      # Routing-only attributes are decided by the URL map, not free attacker text.
      - patterns:
          - pattern: flask.request.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(?!(path|full_path|script_root|url_rule|endpoint|method|blueprint|blueprints)$)
      - pattern: $WRAP(flask.request)
      - patterns:
          - pattern-inside: |
              def $VIEW($REQ, ...):
                ...
          - pattern-either:
              - pattern: $REQ.GET
              - pattern: $REQ.POST
              - pattern: $REQ.COOKIES
              - pattern: $REQ.headers
              - pattern: $REQ.body
    pattern-propagators:
      # Query built piece by piece in a buffer: everything written ends up in getvalue().
      - pattern: $BUF.write($X)
        from: $X
        to: $BUF
    pattern-sanitizers:
      # Escaping the quote the query uses (`value.replace("'", "&apos;")`) keeps it inside the literal.
      - pattern: $X.replace("'", ...)
      - pattern: $X.replace('"', ...)
      - pattern: int(...)
      - pattern: float(...)
      - patterns:
          - pattern: $FN(...)
          - metavariable-regex:
              metavariable: $FN
              regex: (?i).*(xpath_?escape|escape_?xpath|quote_?xpath|xpath_?quote|xpath_?literal)
    pattern-sinks:
      - patterns:
          - pattern-either:
              # The query is the first argument; values passed as keyword variables are safe.
              - pattern: $ROOT.xpath($Q, ...)
              - pattern: lxml.etree.XPath($Q, ...)
              - pattern: lxml.etree.ETXPath($Q, ...)
              - pattern: lxml.etree.XPathEvaluator(...)($Q, ...)
              - pattern: elementpath.select($ROOT, $Q, ...)
              - pattern: elementpath.iter_select($ROOT, $Q, ...)
              - pattern: elementpath.Selector($Q, ...)
          # Input containing a quote was rejected first, so it cannot break out of the literal.
          - pattern-not-inside: |
              if "'" in $V:
                  ...
                  return ...
              ...
          - pattern-not-inside: |
              if "'" in $V:
                  ...
                  raise ...
              ...
          - pattern-not-inside: |
              if "'" in $V:
                  ...
                  flask.abort(...)
              ...
          - focus-metavariable: $Q
