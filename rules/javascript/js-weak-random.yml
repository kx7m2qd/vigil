rules:
  - id: js-weak-random
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A session ID, token, OTP, reset code or other secret is generated with `Math.random()`. Its
      output is not cryptographically secure: V8's xorshift128+ state can be recovered from a few
      outputs, so attackers predict the next tokens and take over sessions or reset links. Use
      `crypto.randomBytes(32).toString('hex')`, `crypto.randomUUID()`, `crypto.randomInt()`, or
      `crypto.getRandomValues()` in the browser.
    metadata:
      title: Insecure randomness for a security value
      cwe: ["CWE-330: Use of Insufficiently Random Values"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: medium
    # Search mode, scoped to values stored as secrets; Math.random for jitter or UI is fine.
    patterns:
      - pattern-either:
          - pattern: $W = <... Math.random() ...>
          - pattern: $O.$W = <... Math.random() ...>
          - pattern: '{..., $W: <... Math.random() ...>, ...}'
          - pattern: $R.cookie("$W", <... Math.random() ...>, ...)
          - patterns:
              - pattern-inside: |
                  $V = <... Math.random() ...>;
                  ...
              - pattern-either:
                  - pattern: $W = <... $V ...>
                  - pattern: $O.$W = <... $V ...>
                  - pattern: '{..., $W: <... $V ...>, ...}'
                  - pattern: $R.cookie("$W", <... $V ...>, ...)
          - patterns:
              - pattern-inside: |
                  function $W(...) { ... }
              - pattern: return <... Math.random() ...>;
      # A bare `token` is too vague (lexers, pagination), so require a qualifier around it.
      - metavariable-regex:
          metavariable: $W
          regex: (?i)^(.*(nonce|otp|secret|passw|session|sessid|salt|csrf|xsrf|api_?key|reset|verif|invite|magic|.token|token.).*|token)$
