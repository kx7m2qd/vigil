rules:
  - id: js-jwt-insecure-verify
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      JWT verification is weakened: allowing the `none` algorithm lets anyone forge a token without
      a signature, and `ignoreExpiration` accepts stolen tokens forever. Pin `algorithms` to the
      ones you issue (e.g. ['RS256']) and keep expiry checks on.
    metadata:
      title: Insecure JWT verification options
      cwe: ["CWE-347: Improper Verification of Cryptographic Signature"]
      owasp: ["A02:2021 - Cryptographic Failures", "A07:2021 - Identification and Authentication Failures"]
      confidence: high
    pattern-either:
      - pattern: '$JWT.verify($T, $K, {..., algorithms: [..., "none", ...], ...}, ...)'
      - pattern: "$JWT.verify($T, $K, {..., ignoreExpiration: true, ...}, ...)"
