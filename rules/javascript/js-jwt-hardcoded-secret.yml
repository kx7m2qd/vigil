rules:
  - id: js-jwt-hardcoded-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      The JWT signing key is a string literal in source code. Anyone with access to the repository
      (or a leaked build) can mint valid tokens for any user. Load the key from an environment
      variable or a secrets manager, and rotate the current one.
    metadata:
      title: Hardcoded JWT secret
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: high
    options:
      symbolic_propagation: true
    patterns:
      - pattern-either:
          - pattern: $JWT.sign($P, "$SECRET", ...)
          - pattern: $JWT.verify($T, "$SECRET", ...)
      - metavariable-regex:
          metavariable: $JWT
          regex: ^(jwt|jsonwebtoken|JWT)$
      - metavariable-regex:
          metavariable: $SECRET
          regex: ^.{1,}$
