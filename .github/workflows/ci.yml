name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Re-verified against pinned SHA-256 on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vigil/engines
          key: vigil-engines-${{ runner.os }}-${{ hashFiles('src/engines/manifest.ts') }}
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run dev -- engines install
      - run: npm run check
      - run: npm run bench
      - run: npm run build
